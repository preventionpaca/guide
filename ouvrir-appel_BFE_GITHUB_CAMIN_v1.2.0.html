<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ouverture BFE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#667085;--blue:#2457d6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    .card{width:min(460px,calc(100vw - 36px));background:var(--card);border:1px solid #e5eaf0;border-radius:18px;box-shadow:0 12px 34px rgba(15,23,42,.12);padding:24px}
    .row{display:flex;align-items:center;gap:14px}.spinner{width:26px;height:26px;border:3px solid #dfe7f7;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite;flex:0 0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}h1{font-size:18px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted);line-height:1.45}
    #fallback{display:none;margin-top:14px;font-size:12px}a{color:var(--blue);font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <h1 id="title">Ouverture du suivi BFE</h1>
        <div class="sub" id="status">Préparation de l’interface…</div>
      </div>
    </div>
    <div id="fallback">Si l’ouverture ne démarre pas, <a id="manualLink" href="#">ouvrir l’interface BFE</a>.</div>
  </div>

<script>
(function(){
  'use strict';
  // VERSION 1.2.0 — 05/09/2026
  const APPS_SCRIPT_EXEC =
    "https://script.google.com/macros/s/AKfycbxNEPixdnwdcbEcNc082Z2MdpHuaeVB0wXGjAI6R0d3hS-bb0jskazupRKSfVvu8RPJ/exec";
  const GRIST_URL =
    "https://camin.getgrist.com/uKYH5wVXdMb7/Ionos-EK/p/10?style=singlePage";

  const p=new URLSearchParams(location.search);
  const appel=p.get("appel")||p.get("fiche")||p.get("id")||"";
  const action=(p.get("action")||"").toLowerCase().trim();
  const title=document.getElementById("title");
  const status=document.getElementById("status");
  const fallback=document.getElementById("fallback");
  document.getElementById("manualLink").href=GRIST_URL;

  let url=APPS_SCRIPT_EXEC;
  if(appel){
    title.textContent="Ouverture de la fiche BFE n°"+appel;
    status.textContent="Chargement de la fiche…";
    url+="?appel="+encodeURIComponent(appel)+"&t="+Date.now();
  }else{
    title.textContent="Ouverture de l’interface BFE";
    status.textContent="Chargement de l’espace de traitement…";
    url+="?action=accueil&t="+Date.now();
  }

  // L'appel Apps Script est lancé sans attendre sa réponse.
  // Le widget CAMIN interroge ensuite OUVRIR_FICHE_AUTO pendant son chargement.
  try{
    fetch(url,{method:"GET",mode:"no-cors",cache:"no-store",credentials:"omit"}).catch(function(){});
  }catch(e){}

  // Redirection très rapide : le widget poursuit lui-même la recherche de la fiche.
  setTimeout(function(){location.replace(GRIST_URL)},250);
  setTimeout(function(){fallback.style.display="block"},2500);
})();
</script>
</body>
</html>
