<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Prévention PACA</title>
  <script src="site-config.js"></script>
  <style>
    :root { --pp-iframe-top-mask-px: 20px; --pp-shell-bg: #f4f7fa; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--pp-shell-bg); }
    #pp-app-shell { position:fixed; inset:0; overflow:hidden; background:var(--pp-shell-bg); }
    #pp-app-frame {
      position:absolute;
      top:calc(-1 * var(--pp-iframe-top-mask-px));
      left:0;
      width:100%;
      height:calc(100% + var(--pp-iframe-top-mask-px));
      border:0;
      background:var(--pp-shell-bg);
    }
    #pp-route-error { margin:2rem; font:600 1rem/1.5 system-ui,sans-serif; color:#7f1d1d; }
  </style>
</head>
<body>
  <main id="pp-app-shell" aria-label="Portail Prévention PACA">
    <iframe id="pp-app-frame" title="Portail Prévention PACA" referrerpolicy="no-referrer" allow="clipboard-write; fullscreen"></iframe>
  </main>
  <p id="pp-route-error" hidden>Le portail est temporairement indisponible.</p>
  <script>
    (async function () {
      'use strict';
      var config = window.PP_SITE_CONFIG || {};
      var params = new URLSearchParams(window.location.search);
      var previewToken = params.get('preview') || '';
      var previewValid = false;
      if (config.maintenance === true && previewToken && /^[a-f0-9]{64}$/i.test(String(config.previewTokenSha256 || ''))) {
        try {
          var bytes = new TextEncoder().encode(previewToken);
          var digest = await crypto.subtle.digest('SHA-256', bytes);
          var digestHex = Array.from(new Uint8Array(digest), function (value) {
            return value.toString(16).padStart(2, '0');
          }).join('');
          previewValid = digestHex === String(config.previewTokenSha256).toLowerCase();
        } catch (ignorePreviewError) {
          previewValid = false;
        }
      }
      if (config.maintenance === true && !previewValid) {
        window.location.replace('index-maintenance.html');
        return;
      }
      var target = String(config.appUrl || '');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(target)) {
        document.getElementById('pp-app-shell').hidden = true;
        document.getElementById('pp-route-error').hidden = false;
        return;
      }
      params.delete('preview');
      var forwardedSearch = params.toString();
      document.getElementById('pp-app-frame').src = target + (forwardedSearch ? '?' + forwardedSearch : '') + window.location.hash;
    }());
  </script>
</body>
</html>
