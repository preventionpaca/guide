<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Prévention PACA</title>
  <script src="site-config.js?v=20260921062655"></script>
  <script src="preview-config.js"></script>
  <style>
    :root { --pp-iframe-top-mask-px: 20px; --pp-shell-bg: #f4f7fa; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--pp-shell-bg); }
    #pp-app-shell { position:fixed; inset:0; overflow:hidden; background:var(--pp-shell-bg); }
    #pp-app-frame {
      position:absolute;
      top:calc(-1 * var(--pp-iframe-top-mask-px));
      left:0;
      width:100%;
      height:calc(100% + var(--pp-iframe-top-mask-px));
      border:0;
      background:var(--pp-shell-bg);
    }
    #pp-route-error { margin:2rem; font:600 1rem/1.5 system-ui,sans-serif; color:#7f1d1d; }
  </style>
</head>
<body>
  <main id="pp-app-shell" aria-label="Portail Prévention PACA">
    <iframe id="pp-app-frame" title="Portail Prévention PACA" referrerpolicy="no-referrer" allow="clipboard-write; fullscreen"></iframe>
  </main>
  <p id="pp-route-error" hidden>Le portail est temporairement indisponible.</p>
  <script>
    (async function () {
      'use strict';
      var config = window.PP_SITE_CONFIG || {};
      var previewConfig = window.PP_PREVIEW_CONFIG || {};
      var appFrame = document.getElementById('pp-app-frame');
      var allowedPages = new Set(['portal-dev','auth','site-help','book-public','regulatory-analysis','quality','equipment-form','equipment-proposal','equipment-admin','equipment-irist','equipment-manager','company-registration','derogation','medical-choice','medical-batch','medical-opinion','workstation-choice','workstation-sheet','workstation-submit','prevention-reference','regulatory-center','regulatory-admin','snapshot-admin','organization-training','domain-diploma-admin','diploma-reference-admin','work-previews','auth-diagnostic','contact','rgpd','guide','establishment-access-confirm','access-recovery-confirm','derogation-example','medical-example','workstation-example']);
      var allowedParams = new Set(['page','action','token','routeTicket','loggedOut','sessionExpired','requestedRoute','id2','legacyId2','equipmentId','equipmentUid','mode','lastName','firstName','birthDate','batchIndex','establishmentId','diplomaId']);
      var allowedRequestedRoutes = new Set(['book','regulatory-analysis','equipment-form','equipment-proposal','equipment-admin','equipment-manager','equipment-irist','derogation','medical','medical-opinion','medical-batch','workstation','workstation-view','workstation-submit','prevention-reference','regulatory-center','regulatory-admin','snapshot-admin','organization-training','domain-diploma-admin','diploma-reference-admin','auth-diagnostic']);
      var navigationChannelNonce = '';
      var navigationClientSource = null;
      var navigationClientOrigin = '';
      function createNavigationChannelNonce() {
        var bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, function (value) { return value.toString(16).padStart(2, '0'); }).join('');
      }
      function resetNavigationChannel() {
        navigationChannelNonce = createNavigationChannelNonce();
        navigationClientSource = null;
        navigationClientOrigin = '';
      }
      function exactMessageShape(data, keys) {
        return !!data && typeof data === 'object' && Object.keys(data).sort().join('|') === keys.slice().sort().join('|');
      }
      function trustedAppsScriptClientOrigin(origin) {
        return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(String(origin || ''));
      }
      function sourceBelongsToAppFrame(source) {
        var current = source;
        try {
          for (var depth = 0; current && depth < 8; depth += 1) {
            if (current === appFrame.contentWindow) return true;
            if (current === current.parent) return false;
            current = current.parent;
          }
        } catch (ignoreCrossOriginTraversal) {
          return false;
        }
        return false;
      }
      var params = new URLSearchParams(window.location.search);
      var previewToken = params.get('preview') || '';
      var previewValid = false;
      if (config.maintenance === true && previewToken && /^[a-f0-9]{64}$/i.test(String(previewConfig.tokenSha256 || ''))) {
        try {
          var bytes = new TextEncoder().encode(previewToken);
          var digest = await crypto.subtle.digest('SHA-256', bytes);
          var digestHex = Array.from(new Uint8Array(digest), function (value) {
            return value.toString(16).padStart(2, '0');
          }).join('');
          previewValid = digestHex === String(previewConfig.tokenSha256).toLowerCase();
        } catch (ignorePreviewError) {
          previewValid = false;
        }
      }
      if (config.maintenance === true && !previewValid) {
        window.location.replace('index-maintenance.html');
        return;
      }
      var target = String(config.appUrl || '');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(target)) {
        document.getElementById('pp-app-shell').hidden = true;
        document.getElementById('pp-route-error').hidden = false;
        return;
      }
      params.delete('preview');
      var forwardedSearch = params.toString();
      if (params.has('routeTicket') && window.history && typeof window.history.replaceState === 'function') {
        var visibleUrl = new URL(window.location.href);
        visibleUrl.searchParams.delete('routeTicket');
        window.history.replaceState(null, '', visibleUrl.pathname + visibleUrl.search + visibleUrl.hash);
      }
      function routeUrl(search, hash) {
        var input = new URLSearchParams(String(search || '').replace(/^\?/, ''));
        var output = new URLSearchParams();
        input.forEach(function (value, name) {
          if (!allowedParams.has(name)) return;
          if (name === 'action' && value !== 'pp_v2_company_email_confirm') return;
          if (name === 'token' && !/^[A-Za-z0-9_-]{32,180}$/.test(value)) return;
          if (name === 'routeTicket' && !/^[A-Za-z0-9_-]{40,160}$/.test(value)) return;
          output.append(name, value);
        });
        if (output.get('action') !== 'pp_v2_company_email_confirm') output.delete('token');
        var page = output.get('page') || 'portal-dev';
        if (!allowedPages.has(page)) page = 'portal-dev';
        output.set('page', page);
        return target + '?' + output.toString() + (/^#[A-Za-z0-9._~!$&'()*+,;=:@/?%-]*$/.test(String(hash || '')) ? String(hash || '') : '');
      }
      function navigationUrl(data) {
        var input, seen = new Set(), valid = true;
        if (!exactMessageShape(data, ['channel','type','nonce','source','search','hash'])) return '';
        if (data.channel !== 'PP_GITHUB_IFRAME_NAV_V1' || data.type !== 'PP_NAVIGATE') return '';
        if (data.nonce !== navigationChannelNonce || !/^[a-f0-9]{64}$/.test(String(data.nonce || ''))) return '';
        if (!/^[a-z][a-z0-9_-]{0,31}$/.test(String(data.source || ''))) return '';
        if (typeof data.search !== 'string' || data.search.length > 2048 || data.search.charAt(0) !== '?') return '';
        if (typeof data.hash !== 'string' || data.hash.length > 1024 || (data.hash && !/^#[A-Za-z0-9._~!$&'()*+,;=:@/?%-]*$/.test(data.hash))) return '';
        input = new URLSearchParams(data.search.slice(1));
        input.forEach(function (value, name) {
          if (!allowedParams.has(name) || seen.has(name) || value.length > 300) valid = false;
          seen.add(name);
        });
        if (!valid || !allowedPages.has(input.get('page') || '')) return '';
        if (input.has('requestedRoute') && !allowedRequestedRoutes.has(input.get('requestedRoute'))) return '';
        if (input.has('action') && input.get('action') !== 'pp_v2_company_email_confirm') return '';
        if (input.has('token') && (input.get('action') !== 'pp_v2_company_email_confirm' || !/^[A-Za-z0-9_-]{32,180}$/.test(input.get('token')))) return '';
        if (input.has('routeTicket') && !/^[A-Za-z0-9_-]{40,160}$/.test(input.get('routeTicket'))) return '';
        return routeUrl(data.search, data.hash);
      }
      resetNavigationChannel();
      appFrame.src = routeUrl(forwardedSearch, window.location.hash);
      window.addEventListener('message', function (event) {
        var data = event && event.data || {};
        if (data.type === 'PP_NAVIGATION_BRIDGE_READY') {
          if (!exactMessageShape(data, ['channel','type']) || data.channel !== 'PP_GITHUB_IFRAME_NAV_V1') return;
          if (!trustedAppsScriptClientOrigin(event.origin) || !sourceBelongsToAppFrame(event.source)) return;
          if (navigationClientSource && (event.source !== navigationClientSource || event.origin !== navigationClientOrigin)) return;
          navigationClientSource = event.source;
          navigationClientOrigin = event.origin;
          try { event.source.postMessage({channel:'PP_GITHUB_IFRAME_NAV_V1',type:'PP_NAVIGATION_PARENT_READY',nonce:navigationChannelNonce}, event.origin); } catch (ignoreReplyError) {}
          return;
        }
        if (event.source !== navigationClientSource || event.origin !== navigationClientOrigin || !sourceBelongsToAppFrame(event.source)) return;
        var next = navigationUrl(data);
        if (!next) return;
        console.info('PP_IFRAME_NAVIGATION source=' + String(data.source || '').replace(/[^a-z0-9_-]/gi,'').slice(0,32) + ' target=' + new URL(next).searchParams.get('page'));
        resetNavigationChannel();
        appFrame.src = next;
      });
    }());
  </script>
</body>
</html>
